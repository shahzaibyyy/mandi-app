name: Generate License

on:
  workflow_dispatch:
    inputs:
      device_id:
        description: Device ID from the activation screen (8 chars)
        required: true
        type: string
      months:
        description: License length in months (30 days each)
        required: false
        default: "1"
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate activation code
        env:
          LICENSE_SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
        run: |
          if [ -z "$LICENSE_SIGNING_KEY" ]; then
            echo "Missing GitHub secret LICENSE_SIGNING_KEY."
            echo "Run tools/generate_keypair.dart locally and add PRIVATE_SEED_B64 to repo secrets."
            exit 1
          fi
          dart run tools/generate_license.dart \
            --device-id="${{ github.event.inputs.device_id }}" \
            --months="${{ github.event.inputs.months }}" | tee license_output.txt

      - name: Summary
        run: |
          echo "## License generated" >> "$GITHUB_STEP_SUMMARY"
          echo "Device ID: ${{ github.event.inputs.device_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Months: ${{ github.event.inputs.months }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^activation_code=' license_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
